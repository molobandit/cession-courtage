services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cession
      POSTGRES_PASSWORD: cession
      POSTGRES_DB: cession_courtage
    ports:
      - "5432:5432"
    volumes:
      - cession_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cession -d cession_courtage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cession_pgdata:
